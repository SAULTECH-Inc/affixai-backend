[project]
name = "ai-document-signer-fastapi"
version = "1.0.0"
description = "AI & Document Intelligence Engine — OCR, field detection, auto-fill, and classification."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web framework
    "fastapi==0.109.0",
    # Plain uvicorn, NOT uvicorn[standard]: the [standard] extra pulls uvloop,
    # and uvloop's create_connection fails with "[Errno 16] Device or resource
    # busy" inside Vercel's sandbox when opening an outbound SSL connection to
    # Postgres — an error that also masks what actually went wrong (a DNS or
    # reachability failure surfaces as EBUSY rather than something readable).
    # Vercel and the Dockerfile both install from this list. Local development
    # gets [standard] back via the dev extra, so --reload still works.
    "uvicorn==0.27.0",
    "python-multipart==0.0.6",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv==1.0.0",
    # Database (aerich is a dev/migration tool; not needed at runtime)
    "tortoise-orm[asyncpg]>=0.20.0,<0.22",
    # Auth & crypto
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "cryptography==42.0.2",
    "email-validator==2.1.0",
    # Email
    "resend>=2.0.0",
    # Billing
    "stripe==8.5.0",
    # AWS / HTTP
    "boto3==1.34.27",
    "httpx==0.26.0",
    # OCR + image processing
    "numpy==1.26.4",
    "pillow==10.2.0",
    "opencv-python-headless==4.6.0.66",
    "pdf2image==1.17.0",
    "pytesseract==0.3.10",
    "pymupdf",
    "fuzzywuzzy==0.18.0",
    "python-Levenshtein==0.25.0",
    # Document processing layer (Phase B). These are imported lazily inside
    # document_processing.py, so a missing one only surfaces at request time
    # as "No module named ..." — which is exactly what happened in deploys
    # built from this file (the Dockerfile runs `poetry install --without dev`,
    # so [project].dependencies is the whole runtime set).
    #   pdf2docx    — PDF → DOCX
    #   python-docx — DOCX read/write, and TXT/Markdown → DOCX
    #   reportlab   — TXT/Markdown → PDF
    "pdf2docx>=0.5.8",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    # Scheduler
    "apscheduler",
    # CSV / Excel parsing for bulk invite file uploads
    "openpyxl>=3.1.0",
    # Cloudinary file storage
    "cloudinary",
    # Google Drive cloud export talks to Google directly over httpx — see
    # cloud_storage/google_drive.py. The google-* client libraries are
    # deliberately NOT dependencies: google-api-python-client alone bundles
    # ~100MB of static API discovery documents and pushed the Vercel function
    # over its 500MB limit.
    # Logging
    "loguru==0.7.2",
]

[project.optional-dependencies]
# OCR pre-pass for scanned PDF → DOCX. Deliberately an extra, not a runtime
# dependency: it needs the `tesseract` and `ghostscript` binaries, which
# Vercel's Python runtime can't provide, and adding it to the base set would
# push the function bundle back toward the 500MB limit for a feature that
# can't run there. Install on hosts that can supply the binaries:
#   pip install '.[ocr]'   (plus: brew install tesseract ghostscript)
# Without it, scanned PDF → DOCX returns 501 instead of an empty document.
ocr = [
    "ocrmypdf>=16.0.0",
]
dev = [
    # uvloop + httptools + watchfiles for local --reload. Kept out of the
    # runtime set on purpose — see the uvicorn entry above.
    "uvicorn[standard]==0.27.0",
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "black==24.1.1",
    "flake8==7.0.0",
    "mypy==1.8.0",
]

[tool.poetry]
name = "ai-document-signer-fastapi"
version = "1.0.0"
description = "AI & Document Intelligence Engine — OCR, field detection, auto-fill, and classification."
authors = ["AI Document Signer Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# FastAPI and Web Framework
fastapi = "0.109.0"
# No "standard" extra here either: Poetry merges this table into [project] as
# enrichment, and the extra would pull uvloop back into the lock.
uvicorn = "0.27.0"
python-multipart = "0.0.6"
pydantic = ">=2.7.0"
pydantic-settings = ">=2.3.0"

# AI and ML Libraries
tensorflow = "2.15.0"
torch = "2.1.2"
torchvision = "0.16.2"
transformers = "4.36.2"
numpy = "1.26.4"
pillow = "10.2.0"

# OCR and Document Processing
pytesseract = "0.3.10"
pdf2image = "1.17.0"
pypdf2 = "3.0.1"
opencv-python = "4.6.0.66"
python-docx = "1.1.0"
openpyxl = "3.1.2"

# NLP and Text Processing
spacy = "3.7.2"
nltk = "3.8.1"
fuzzywuzzy = "0.18.0"
python-Levenshtein = "0.25.0"

# Computer Vision
easyocr = "1.7.1"
paddleocr = "2.7.0.3"
layoutparser = "0.3.4"

# HTTP and Async
httpx = "0.26.0"
aiohttp = "3.9.1"
requests = "2.31.0"

# Primary Database (Postgres via Tortoise ORM)
tortoise-orm = {extras = ["asyncpg"], version = "0.20.0"}
aerich = "0.7.2"

# Error reporting (optional — only initialized when SENTRY_DSN is set)
sentry-sdk = {extras = ["fastapi"], version = "2.19.2"}

# Caching / secondary stores
redis = "5.0.1"
pymongo = "4.6.1"

# Auth & Crypto
python-dotenv = "1.0.0"
python-jose = {extras = ["cryptography"], version = "3.3.0"}
passlib = {extras = ["bcrypt"], version = "1.7.4"}
# Must match [project].dependencies — Poetry merges the two tables and
# errors out on incompatible constraints.
bcrypt = "4.0.1"
cryptography = "42.0.2"
itsdangerous = "2.1.2"
authlib = "1.3.0"
email-validator = "2.1.0"

# Email
resend = ">=2.0.0"

# Billing
stripe = "8.5.0"

# Rate limiting
slowapi = "0.1.9"

# AWS and Cloud Storage
boto3 = "1.34.27"
botocore = "1.34.27"

# Logging and Monitoring
loguru = "0.7.2"
prometheus-fastapi-instrumentator = "6.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
pytest-asyncio = "0.23.3"
black = "24.1.1"
flake8 = "7.0.0"
mypy = "1.8.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.aerich]
tortoise_orm = "app.db.base.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.pytest.ini_options]
# Make `app`, `main`, etc. importable from tests without installing the
# package. pytest discovers conftest.py in tests/ but needs help finding
# the project root for module resolution.
pythonpath = ["."]
asyncio_mode = "auto"
# Auto-mode means we don't need @pytest.mark.asyncio on every async test
# (it's redundant but harmless; we leave the marker for clarity).
testpaths = ["tests"]
# Skip the legacy test files in the existing tests/ dir — they reference
# `app.services.autofill_service` which doesn't exist in the current
# codebase. New tests go in files starting with test_<feature>.py.
addopts = "--ignore=tests/test_autofill.py --ignore=tests/test_classification.py --ignore=tests/test_spatial_analysis.py"
